<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Havenbrook — Digital Town</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1420'/><path d='M6 22h20v4H6z' fill='%237fc4e8'/><path d='M14 4h4v10h10v4H18v10h-4V18H4v-4h10z' fill='%23e05555'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0b1420; height:100%;
               font-family:"Segoe UI", Arial, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- floating labels ---------- */
  .lbl { position:absolute; transform:translate(-50%,-50%); pointer-events:none;
         background:rgba(252,253,252,.88); color:#16323e; border-radius:9px;
         padding:3px 8px 3px 6px; font-size:13px; font-weight:600; white-space:nowrap;
         box-shadow:0 1px 3px rgba(12,40,56,.12), 0 6px 18px -8px rgba(12,40,56,.28);
         border:1px solid rgba(13,48,64,.10); backdrop-filter:blur(8px);
         display:flex; align-items:center; gap:6px; letter-spacing:.2px; }
  .lbl .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto;
              box-shadow:0 0 0 2px rgba(255,255,255,.8); }
  .lbl .num { position:absolute; top:-8px; left:-8px; width:17px; height:17px;
              background:#12303f; color:#fff; border-radius:50%; font-size:10px;
              display:flex; align-items:center; justify-content:center; font-weight:700; }
  .lbl.free { background:rgba(255,246,214,.95); }
  .lbl.minor { font-size:11px; padding:2px 6px; opacity:.94; }
  .lbl.dist { background:transparent; border:none; box-shadow:none;
              color:rgba(20,45,35,.55); font-size:15px; font-weight:800;
              letter-spacing:2.5px; text-shadow:0 0 6px rgba(255,255,255,.85),
              0 0 12px rgba(255,255,255,.7); font-style:italic; }
  .lbl.roadname { background:transparent; border:none; box-shadow:none;
              color:rgba(25,45,38,.7); font-size:11.5px; font-weight:700;
              letter-spacing:1.6px; font-style:italic; white-space:nowrap;
              text-shadow:0 0 5px rgba(255,255,255,.9), 0 0 9px rgba(255,255,255,.8); }
  .lbl.roadname.vert { transform:translate(-50%,-50%) rotate(-90deg); }

  /* ---------- legend / title overlay ---------- */
  #legend { position:absolute; left:18px; bottom:18px; background:rgba(252,253,252,.86);
            border:1px solid rgba(13,48,64,.10); border-radius:14px; padding:12px 16px;
            max-width:330px; backdrop-filter:blur(14px) saturate(1.3);
            box-shadow:0 2px 3px rgba(12,40,56,.05), 0 16px 40px -14px rgba(9,30,42,.35);
            display:none; }
  #legend h3 { margin:0 0 6px; font-size:14px; color:#0e2a3a; letter-spacing:.4px; }
  #legend .cat { display:flex; align-items:center; gap:8px; font-size:12px;
                 color:#23404e; margin:3px 0; }
  #legend .dot { width:11px; height:11px; border-radius:50%; }
  #titlecard { position:absolute; right:18px; top:16px; text-align:right; display:none;
               color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  #titlecard h1 { margin:0; font-size:30px; letter-spacing:1px; }
  #titlecard p { margin:2px 0 0; font-size:13px; opacity:.9; }
  #compass { position:absolute; right:22px; bottom:20px; width:58px; height:58px;
             display:none; opacity:.92; }
  #hint { position:absolute; left:18px; top:16px; background:rgba(252,253,252,.72);
          color:#33505d; border:1px solid rgba(13,48,64,.10); border-radius:10px;
          padding:8px 12px; font-size:11.5px; line-height:1.6;
          backdrop-filter:blur(12px); pointer-events:none; transition:opacity 1s;
          box-shadow:0 1px 2px rgba(12,40,56,.06), 0 10px 26px -12px rgba(9,30,42,.28); }
  #hint b { color:#17556e; }
  #hud { position:absolute; left:18px; bottom:18px; background:rgba(8,16,24,.75);
         color:#9fe0a8; font:12px/1.4 Consolas,monospace; padding:7px 11px;
         border-radius:6px; display:none; pointer-events:none; }
  #loading { position:fixed; inset:0; background:#0b1420; z-index:50;
             display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:14px; transition:opacity .7s; color:#dfe9ef; }
  #loading h1 { font-size:34px; letter-spacing:6px; margin:0; font-weight:300; }
  #loading h1 b { font-weight:700; color:#7fc4e8; }
  #loading p { margin:0; font-size:12px; letter-spacing:3px; opacity:.6; }
  #loading .bar { width:220px; height:2px; background:rgba(255,255,255,.12);
                  overflow:hidden; border-radius:2px; }
  #loading .bar i { display:block; height:100%; width:40%; background:#7fc4e8;
                    animation:load 1.1s ease-in-out infinite alternate; }
  @keyframes load { from { transform:translateX(-100%);} to { transform:translateX(350%);} }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="loading"><h1>HAVEN<b>BROOK</b></h1><p>A COMMUNITY PLANNED AROUND CARE</p><div class="bar"><i></i></div></div>
<script>
// boot watchdog — inline so it survives a module-load failure (e.g. a
// network flap killing main.js leaves the veil up forever). Reloads if
// __ready hasn't fired in 30s, capped at 3 tries per tab session.
(function () {
  var KEY = 'hbBoot';
  var n = +sessionStorage.getItem(KEY) || 0;
  setTimeout(function () {
    if (!window.__ready && n < 3) {
      sessionStorage.setItem(KEY, n + 1);
      location.reload();
    }
  }, 30000);
  var poll = setInterval(function () {
    if (window.__ready) { sessionStorage.removeItem(KEY); clearInterval(poll); }
  }, 1000);
})();
</script>
<div id="labels"></div>
<div id="hud"></div>
<div id="legend"></div>
<div id="titlecard"><h1>HAVENBROOK</h1><p>A community planned around care</p></div>
<div id="hint"><b>FLY MODE</b> — drag to look · <b>WASD</b> move · <b>Q/E</b> down/up · <b>Shift</b> fast · wheel = speed · dbl-click = orbit</div>
<svg id="compass" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="26" fill="rgba(255,255,255,.9)" stroke="#23404e" stroke-width="2"/>
  <polygon points="30,8 25,30 35,30" fill="#b3423a"/>
  <polygon points="30,52 25,30 35,30" fill="#23404e"/>
  <text x="30" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">N</text>
</svg>
<script type="module" src="./js/main.js"></script>
</body>
</html>
